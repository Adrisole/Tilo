<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TILO · Mi superpoder de cuidarme</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#513922;font-family:'Trebuchet MS',Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #1b639d;outline-offset:3px}.wrap{max-width:640px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:900;color:#a54d30}.home,.back{border:2px solid #d4b184;background:#fff0d5;border-radius:17px;padding:13px;text-decoration:none;color:#513922;font-weight:900;min-height:52px}.back{background:#e5eeff}.progress{display:flex;gap:7px;margin:22px 0}.progress i{height:12px;border-radius:12px;background:#e9dfd0;flex:1}.progress i.on{background:#e8aa39}h1{text-align:center;font-size:clamp(26px,6vw,37px);margin:12px 0}.intro{text-align:center;font-size:19px}.scene{border:3px solid #f1d09c;border-radius:26px;background:#fff1d6;padding:17px;display:flex;align-items:center;gap:14px;margin:20px 0}.scene img{width:125px;height:160px;object-fit:contain}.scene p{font-size:clamp(18px,4.5vw,24px);font-weight:900;line-height:1.35;margin:0}.answers{display:grid;gap:12px}.answer{width:100%;min-height:85px;border:3px solid #d8c6ac;background:white;border-radius:22px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;font-size:clamp(17px,4vw,22px);font-weight:900;color:#513922}.answer .emoji{font-size:35px}.answer.good{background:#d8f6dd;border-color:#299e4c;color:#19592b}.answer.bad{background:#ffe0e0;border-color:#db4545;color:#8b2222}.feedback{margin:16px 0;padding:15px;min-height:60px;border-radius:18px;font-size:19px;font-weight:900;text-align:center}.feedback.good{background:#d8f6dd;color:#19592b}.feedback.bad{background:#ffe0e0;color:#8b2222}.next{width:100%;min-height:69px;border:0;border-radius:20px;background:#e9b046;font-size:24px;font-weight:900;color:#513922}.next:disabled{background:#e8dfd2;color:#968879}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.controls button{min-height:55px;border:2px solid #c9b8a0;background:#fff;border-radius:16px;padding:12px;font-weight:900}.finish{text-align:center;padding:30px 5px}.finish img{width:200px;height:220px;object-fit:contain}.finish p{font-size:22px;line-height:1.5}.finish a{display:block;margin-top:20px}.steps{font-size:clamp(19px,4.5vw,25px);font-weight:900;line-height:1.7;background:#e1f3e7;border-radius:20px;padding:20px;margin:18px 0}@media(max-width:420px){.scene{padding:12px}.scene img{width:94px;height:125px}.answer{padding:11px;min-height:78px}.answer .emoji{font-size:30px}}
</style></head><body><main class="wrap"><header class="head"><div class="brand">🐘 TILO me ayuda</div><a class="home" href="index.html">🏠 Menú</a></header><div id="game"></div></main><script>
'use strict';
const situations=[
{story:'Una persona que no conozco me ofrece caramelos y me pide que vaya con ella.',options:[['🍬','Acepto y voy con esa persona'],['🛑','Digo NO, me alejo y busco ayuda']],correct:1,tip:'¡Bien! No voy con alguien que no conozco, aunque me ofrezca regalos.'},
{story:'Un adulto que no conozco me pide que lo acompañe a buscar a su perrito.',options:[['🐶','Voy a buscar al perrito'],['👥','Digo NO, me alejo y voy donde hay gente']],correct:1,tip:'¡Muy bien! Si un adulto necesita ayuda, debe pedirla a otro adulto.'},
{story:'Una persona dice que conoce a mi familia y quiere llevarme en su auto, pero nadie me avisó.',options:[['🚗','Subo porque dice que conoce a mi familia'],['🏠','No voy. Busco a mi adulto de confianza']],correct:1,tip:'¡Exacto! No me voy sin confirmarlo con mi adulto de confianza.'},
{story:'Alguien me pide que guarde un secreto que me asusta o me incomoda.',options:[['🤫','No se lo cuento a nadie'],['🗣️','Se lo cuento a un adulto de confianza']],correct:1,tip:'¡Muy bien! Los secretos que asustan se cuentan. Si uno no escucha, busco a otro adulto.'},
{story:'Una persona insiste en que vaya con ella, aunque ya dije que NO.',options:[['🙊','Me quedo callado y la sigo'],['📣','Me alejo, voy donde hay gente y pido ayuda']],correct:1,tip:'¡Bien! Puedo gritar: ¡AYUDA! ¡NO CONOZCO A ESTA PERSONA!'},
{story:'Un amigo me dice: si no saltás desde ahí, sos un gallina.',options:[['🧗','Salto para demostrar que soy valiente'],['✋','Digo NO. No tengo que demostrar nada']],correct:1,tip:'¡Bien! Un buen amigo no me obliga a correr riesgos.'},
{story:'Un amigo me dice: si no hacés lo que quiero, no juego más con vos.',options:[['😟','Hago lo que dice para no perder su amistad'],['💬','Digo: no quiero hacer eso']],correct:1,tip:'¡Muy bien! Puedo poner límites y buscar otros compañeros.'},
{story:'Alguien se burla de mi cuerpo o de cómo hago las cosas.',options:[['💔','Me quedo con la burla en silencio'],['🛑','Digo: no me gusta. Pará. Y busco apoyo']],correct:1,tip:'¡Bien! Merecemos respeto. Si sigue pasando, se lo cuento a un adulto.'}
];
let step=0,selected=null;const target=document.getElementById('game');
function say(t){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function render(){if(step>=situations.length){target.innerHTML='<section class="finish"><h1>🏆 ¡Mi voz importa!</h1><img src="tilo-modelo.png" alt="Tilo, el elefante de barba roja"><div class="steps">🛑 Digo NO<br>🚶 Me alejo<br>👥 Voy donde hay gente<br>🗣️ Pido ayuda</div><p>Si estoy en peligro, puedo gritar fuerte. Si un adulto no me escucha, busco a otro.</p><button class="next" onclick="restart()">🔄 Volver a jugar</button><a class="home" href="index.html">🏠 Menú principal</a></section>';return}
const q=situations[step],correct=selected===q.correct;target.innerHTML='<div class="progress" aria-label="Desafío '+(step+1)+' de '+situations.length+'">'+situations.map((_,i)=>'<i class="'+(i<=step?'on':'')+'"></i>').join('')+'</div><h1>🛡️ Mi superpoder de cuidarme</h1><p class="intro">¿Qué haría Tilo?</p><div class="scene"><img src="tilo-modelo.png" alt="Tilo, elefante de barba roja"><p>'+q.story+'</p></div><div class="answers">'+q.options.map((a,i)=>'<button class="answer '+(selected===i?(correct?'good':'bad'):'')+'" onclick="choose('+i+')"><span class="emoji">'+a[0]+'</span><span>'+a[1]+'</span></button>').join('')+'</div><div class="feedback '+(selected===null?'':correct?'good':'bad')+'" aria-live="polite">'+(selected===null?'':correct?'🟢 '+q.tip:'🔴 Esa opción no es segura. Probemos otra.')+'</div><button class="next" onclick="advance()" '+(!correct?'disabled':'')+'>'+(step===situations.length-1?'¡Terminar! 🏆':'Siguiente ➜')+'</button><div class="controls"><button onclick="back()">⬅️ Atrás</button><button onclick="listen()">🔊 Escuchar</button></div>'}
function listen(){let q=situations[step];if(q)say(q.story+'. '+q.options.map(a=>a[1]).join('. O: '))}
function choose(i){if(selected===situations[step].correct)return;selected=i;render();say(i===situations[step].correct?situations[step].tip:'Esa opción no es segura. Probemos otra.')}
function advance(){if(selected!==situations[step].correct)return;step++;selected=null;render();if(step<situations.length)say(situations[step].story)}
function back(){if(step===0){location.href='index.html';return}step--;selected=null;render()}
function restart(){step=0;selected=null;render()}
render();
</script></body></html>
