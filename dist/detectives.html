*{box-sizing:border-box}body{margin:0;background:#fff8ed;font-family:system-ui,-apple-system,sans-serif;color:#3a2b22}.app{max-width:540px;margin:auto;padding:16px 16px 36px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:23px;font-weight:900;color:#ac4b24}.tag{background:#ffe2a2;padding:8px 12px;border-radius:20px;font-weight:700;font-size:13px}.progress{display:flex;gap:7px;margin:18px 0}.progress span{height:9px;flex:1;border-radius:20px;background:#e5d9c8}.progress span.done{background:#efad33}h1{font-size:clamp(23px,6vw,30px);text-align:center;margin:10px 0 5px}.subtitle{text-align:center;margin:0 0 14px;color:#6d5b4b}.picture{height:min(46vh,390px);min-height:250px;display:flex;justify-content:center}.picture img{height:100%;width:auto;max-width:100%;object-fit:contain;border-radius:20px;box-shadow:0 5px 18px #47351b22}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}button{cursor:pointer;font:inherit;touch-action:manipulation}.choice{min-height:75px;background:white;border:3px solid #e5d5bf;border-radius:19px;font-weight:800;font-size:clamp(16px,4vw,20px);display:flex;align-items:center;justify-content:center;gap:8px}.choice span{font-size:29px}.choice.correct{background:#d8f5d8;border-color:#24994d}.choice.wrong{background:#ffe1de;border-color:#df4b43}.choice:focus-visible,.next:focus-visible{outline:4px solid #533dff;outline-offset:2px}.feedback{min-height:64px;text-align:center;padding:12px 8px;font-size:19px;font-weight:800}.feedback.good{color:#167339}.feedback.bad{color:#ad3434}.next{display:block;width:100%;border:0;border-radius:20px;background:#f1b73d;color:#2c251a;padding:17px;font-size:23px;font-weight:900;min-height:66px}.next:disabled{background:#e9e1d5;color:#8d8172}.bottom{display:flex;justify-content:space-between;margin-top:14px;gap:10px}.minor{background:transparent;border:2px solid #bfae96;border-radius:14px;padding:10px 14px;font-weight:700}.finish{text-align:center;padding:50px 0 15px}.finish h2{font-size:30px}.note{font-size:12px;text-align:center;color:#746a5f;margin-top:20px}

let round=0,chosen=null,order=[2,0,3,1,4];const root=document.querySelector('#screen');
function say(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-AR';u.rate=.85;speechSynthesis.speak(u)}
function show(){if(round>=5){root.innerHTML=`<section class="finish"><div style="font-size:72px">🏆</div><h2>¡Lo lograste!</h2><p>Reconociste las emociones de Tilo.</p><button class="next" onclick="restart()">↻ Volver a jugar</button><a class="nav-home finish-home" href="index.html">🏠 Volver al menú</a></section>`;say('¡Lo lograste!');return}
const idx=order[round],correct=chosen===idx;root.innerHTML=`<div class="progress">${Array.from({length:5},(_,i)=>`<span class="${i<=round?'done':''}"></span>`).join('')}</div><h1>¿Cómo se siente Tilo?</h1><p class="subtitle">👆 Mirá su carita y elegí</p><div class="picture"><img src="${images[idx]}" alt="Tilo expresando una emoción"></div><div class="choices">${emotions.map((e,i)=>`<button class="choice ${chosen===i?(correct?'correct':'wrong'):''}" onclick="answer(${i})" ${correct?'disabled':''}><span>${e.emoji}</span>${e.name}</button>`).join('')}</div><div class="feedback ${chosen===null?'':correct?'good':'bad'}" aria-live="polite">${chosen===null?'':correct?'⭐ ¡Muy bien!':'💛 Probá otra vez'}</div><button class="next" onclick="next()" ${!correct?'disabled':''}>${round===4?'Terminar 🏆':'Seguir ➜'}</button><div class="bottom"><button class="minor" onclick="say('¿Cómo se siente Tilo?')">🔊 Escuchar</button><button class="minor" onclick="restart()">↻ Reiniciar</button></div>`;}
function answer(i){if(chosen===order[round])return;chosen=i;show();say(i===order[round]?'¡Muy bien! '+emotions[i].name:'Probá otra vez')}
function next(){if(chosen!==order[round])return;round++;chosen=null;show();if(round<5)say('¿Cómo se siente Tilo?')}
function previous(){if(round>0){round--;chosen=null;show();say("¿Cómo se siente Tilo?")}else{window.location.href="index.html"}}
function restart(){round=0;chosen=null;show()}
