<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Qué puedo hacer? · TILO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8ed;color:#503723;font-family:'Trebuchet MS',Arial,sans-serif}button,a{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #2c66a4;outline-offset:3px}.app{max-width:650px;margin:auto;padding:16px 18px 38px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:24px;font-weight:900;color:#9e4b2b}.home,.back{border:3px solid #b88c61;background:#fff0d5;border-radius:18px;padding:12px 15px;min-height:56px;color:#5a3c25;text-decoration:none;font-weight:900}.nav{display:flex;gap:12px;justify-content:space-between;margin:18px 0}.back{background:#e1ecff;border-color:#86a7db}.progress{display:flex;gap:7px;margin:12px 0 22px}.progress span{height:11px;background:#e6dacc;flex:1;border-radius:20px}.progress span.done{background:#f4b33d}h1{text-align:center;font-size:clamp(26px,6vw,35px);margin:10px 0}.lead{text-align:center;font-size:18px;margin:8px 0 16px}.scene{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:12px;border:3px solid #efcd94;background:#fff3d7;border-radius:26px;padding:16px;margin-bottom:18px}.scene img{width:100%;max-height:180px;object-fit:contain}.scene p{font-size:clamp(19px,4vw,24px);font-weight:900;line-height:1.35;margin:0}.choices{display:grid;gap:12px}.choice{display:flex;align-items:center;text-align:left;gap:14px;background:#fff;border:3px solid #e4cfb0;border-radius:23px;padding:15px;min-height:86px;font-size:clamp(18px,4vw,22px);font-weight:800;color:#503723}.choice .emoji{font-size:36px;min-width:44px}.choice.correct{background:#d6f8df;border-color:#20a351;color:#14572d}.choice.wrong{background:#ffe0e0;border-color:#e04444;color:#8c2020}.feedback{min-height:62px;border-radius:18px;padding:15px;font-size:19px;font-weight:900;text-align:center;margin:15px 0}.feedback.good{background:#d6f8df;color:#14572d}.feedback.bad{background:#ffe0e0;color:#8c2020}.next{width:100%;min-height:68px;border:0;border-radius:20px;background:#e7a637;color:#3f2c1a;font-size:26px;font-weight:900;box-shadow:0 5px 0 #c18b2b}.next:disabled{background:#e9e0d5;color:#918271;box-shadow:none}.bottom{display:flex;gap:12px;justify-content:space-between;margin-top:20px}.minor{border:2px solid #bfae96;background:#fffaf1;border-radius:15px;min-height:56px;padding:12px;font-weight:800}.finish{text-align:center;padding:25px 0}.finish img{width:210px;max-width:80%}.finish p{font-size:22px}.finish .home{display:inline-flex;align-items:center;justify-content:center;margin-top:20px;width:100%}@media(max-width:430px){.scene{grid-template-columns:95px 1fr;padding:12px}.scene img{max-height:140px}.nav a,.nav button{padding:10px;font-size:15px}.choice{min-height:76px;padding:11px}.choice .emoji{font-size:30px;min-width:36px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="app"><header class="top"><div class="logo">🐘 TILO <small>me ayuda</small></div><div>🎮 Nuevo juego</div></header><nav class="nav"><a class="home" href="index.html">🏠 Menú principal</a><button class="back" onclick="previous()">⬅️ Atrás</button></nav><div id="game"></div></main>
<script>
'use strict';
const rounds=[
{scene:'La torre de bloques de Tilo se cayó.',choices:[['🌬️','Respiro y vuelvo a intentar'],['💥','Rompo los bloques de los demás']],correct:0,why:'¡Bien! Podemos sentir enojo y volver a intentar.'},
{scene:'Luma está triste porque perdió su juguete.',choices:[['🤝','Le pregunto si quiere compañía'],['🙈','Me río de ella']],correct:0,why:'¡Muy bien! Podemos acompañar sin obligar a hablar.'},
{scene:'Tilo tiene miedo de cruzar un puente.',choices:[['🫶','Pido ayuda a alguien de confianza'],['🏃','Corro sin mirar']],correct:0,why:'¡Muy bien! Pedir ayuda también es ser valiente.'},
{scene:'Milo quiere jugar, pero Tilo necesita descansar.',choices:[['💬','Digo: ahora necesito un ratito'],['😡','Le grito para que se vaya']],correct:0,why:'¡Bien! Podemos poner límites con respeto.'},
{scene:'Chispita ganó un juego y Tilo no.',choices:[['👏','La felicito y sigo practicando'],['😠','Le digo que hizo trampa sin saberlo']],correct:0,why:'¡Excelente! Podemos alegrarnos por otros y seguir aprendiendo.'}
];
let step=0,choice=null;const root=document.getElementById('game');
function speak(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=.86;speechSynthesis.speak(u)}catch(e){}}
function show(){if(step>=rounds.length){root.innerHTML='<section class="finish"><div style="font-size:75px">🏆</div><h1>¡Lo lograste!</h1><img src="tilo-modelo.png" alt="Tilo, elefante de barba roja"><p>¡Aprendiste nuevas formas de cuidarte y cuidar a otros!</p><button class="next" onclick="restart()">🔄 Volver a jugar</button><a class="home" href="index.html">🏠 Menú principal</a></section>';return}
const r=rounds[step],ok=choice===r.correct;root.innerHTML='<div class="progress">'+rounds.map((_,i)=>'<span class="'+(i<=step?'done':'')+'"></span>').join('')+'</div><h1>¿Qué puedo hacer?</h1><p class="lead">👆 Elegí cómo puede actuar Tilo</p><div class="scene"><img src="tilo-modelo.png" alt="Tilo, elefante de barba roja"><p>'+r.scene+'</p></div><div class="choices">'+r.choices.map((c,i)=>'<button class="choice '+(choice===i?(ok?'correct':'wrong'):'')+'" onclick="answer('+i+')"><span class="emoji">'+c[0]+'</span><span>'+c[1]+'</span></button>').join('')+'</div><div class="feedback '+(choice===null?'':ok?'good':'bad')+'" aria-live="polite">'+(choice===null?'':ok?'🟢 '+r.why:'🔴 Probá otra vez. ¡Vos podés!')+'</div><button class="next" onclick="next()" '+(!ok?'disabled':'')+'>'+(step===rounds.length-1?'Terminar 🏆':'Seguir ➜')+'</button><div class="bottom"><button class="minor" onclick="listen()">🔊 Escuchar</button><button class="minor" onclick="restart()">🔄 Reiniciar</button></div>'}
function listen(){const r=rounds[step];if(r)speak(r.scene+'. '+r.choices.map(c=>c[1]).join('. O bien: '))}
function answer(i){if(choice===rounds[step].correct)return;choice=i;show();speak(i===rounds[step].correct?rounds[step].why:'Probá otra vez. Vos podés.')}
function next(){if(choice!==rounds[step].correct)return;step++;choice=null;show();if(step<rounds.length)speak(rounds[step].scene)}
function previous(){if(step===0){window.location.href='index.html';return}step--;choice=null;show()}
function restart(){step=0;choice=null;show()}
show();
</script></body></html>
